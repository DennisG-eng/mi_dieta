<!doctype html>
<title>Plan Semanal</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #EDF0EB;
  --surface: #FFFFFF;
  --surface-2: #E4E9E1;
  --border: #CDD5C9;
  --text: #161D14;
  --text-2: #566054;
  --text-3: #8E9E8A;
  --accent: #1A4830;
  --accent-mid: #2C7A4E;
  --accent-light: #E9F1EB;
  --gold: #9B7519;
  --gold-bg: #FBF4E2;
  --pilates: #5A3E8A;
  --pilates-bg: #EEE9F8;
  --walk: #1A6857;
  --walk-bg: #E6F3EF;
  --rest: #7A8E78;
  --rest-bg: #EEF1EC;
  --r: 14px;
  --r-sm: 8px;
  --sh: 0 2px 12px rgba(22,29,20,.07);
  --sh-lg: 0 8px 32px rgba(22,29,20,.13);
  --ease: .2s ease;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1310;
    --surface: #152018;
    --surface-2: #1C2B1E;
    --border: #283826;
    --text: #D6E4D0;
    --text-2: #8BAA84;
    --text-3: #587052;
    --accent: #4DB87A;
    --accent-mid: #5ED08A;
    --accent-light: #162A1E;
    --gold: #D4A835;
    --gold-bg: #261F0C;
    --pilates: #A07ED8;
    --pilates-bg: #1C1530;
    --walk: #44BFA0;
    --walk-bg: #0E2420;
    --rest: #587052;
    --rest-bg: #131A12;
    --sh: 0 2px 12px rgba(0,0,0,.35);
    --sh-lg: 0 8px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg: #0C1310;
  --surface: #152018;
  --surface-2: #1C2B1E;
  --border: #283826;
  --text: #D6E4D0;
  --text-2: #8BAA84;
  --text-3: #587052;
  --accent: #4DB87A;
  --accent-mid: #5ED08A;
  --accent-light: #162A1E;
  --gold: #D4A835;
  --gold-bg: #261F0C;
  --pilates: #A07ED8;
  --pilates-bg: #1C1530;
  --walk: #44BFA0;
  --walk-bg: #0E2420;
  --rest: #587052;
  --rest-bg: #131A12;
  --sh: 0 2px 12px rgba(0,0,0,.35);
  --sh-lg: 0 8px 32px rgba(0,0,0,.45);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}

/* HEADER */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surface);border-bottom:1px solid var(--border)}
.hdr{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo-eyebrow{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--text-3)}
.logo-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:600;color:var(--accent);letter-spacing:-.01em}
.week-nav{display:flex;align-items:center;gap:10px}
.wlabel{font-size:13px;font-weight:500;min-width:68px;text-align:center;color:var(--text)}
.wnav-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:15px;transition:var(--ease)}
.wnav-btn:hover{background:var(--surface-2);color:var(--text)}
.hdr-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:24px;font-size:13px;font-weight:500;border:none;transition:var(--ease)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-active{background:var(--accent);color:#fff;border-color:transparent}

/* DAY NAV */
.daynav-wrap{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.daynav-wrap::-webkit-scrollbar{display:none}
.daynav{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;gap:6px}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 12px;border-radius:12px;border:1.5px solid transparent;background:transparent;min-width:58px;flex-shrink:0;transition:var(--ease)}
.day-pill:hover{background:var(--surface-2)}
.day-pill.active{background:var(--accent-light);border-color:var(--accent)}
.dp-short{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
.day-pill.active .dp-short{color:var(--accent)}
.dp-num{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);line-height:1}
.day-pill.active .dp-num{color:var(--accent)}
.dp-badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.dp-pilates{background:var(--pilates-bg);color:var(--pilates)}
.dp-walk{background:var(--walk-bg);color:var(--walk)}
.dp-rest{background:var(--rest-bg);color:var(--rest)}

/* MAIN */
.main{flex:1;max-width:1000px;margin:0 auto;width:100%;padding:24px 20px}

/* DAY HEADER */
.day-hdr{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.day-hdr-left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.day-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;line-height:1}
.exc-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.exc-pilates{background:var(--pilates-bg);color:var(--pilates)}
.exc-walk{background:var(--walk-bg);color:var(--walk)}
.exc-rest{background:var(--rest-bg);color:var(--rest)}
.kcal-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--surface-2);font-size:11px;font-weight:500;color:var(--text-2);font-family:'DM Mono',monospace}

/* MEAL GRID */
.meal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.meal-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow var(--ease),transform var(--ease);display:flex;flex-direction:column}
.meal-card:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.mc-type{padding:14px 16px 0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-3)}
.mc-name{padding:6px 16px 14px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;line-height:1.2;color:var(--text);flex:1}
.mc-footer{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.mc-kcal{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
.mc-right{display:flex;align-items:center;gap:6px}
.mc-prep{font-size:10px;color:var(--text-3)}
.mc-prep-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;background:var(--gold-bg);color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.mc-arrow{color:var(--text-3);font-size:12px}

/* Cena card larger */
.meal-card.cena-card{grid-column:span 2}

/* SHOPPING VIEW */
.shopping-hdr{margin-bottom:20px}
.shop-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;margin-bottom:4px}
.shop-sub{font-size:13px;color:var(--text-2);margin-bottom:16px}
.trip-tabs{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.trip-tabs-row{display:flex;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.trip-tab{flex:1;padding:14px 18px;background:var(--surface);border:none;font-family:inherit;cursor:pointer;transition:var(--ease);text-align:left;border-right:1px solid var(--border)}
.trip-tab:last-child{border-right:none}
.trip-tab.active{background:var(--accent-light)}
.trip-tab-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-bottom:3px}
.trip-tab.active .trip-tab-label{color:var(--accent)}
.trip-tab-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;color:var(--text)}
.trip-tab.active .trip-tab-name{color:var(--accent)}
.trip-tab-desc{font-size:11px;color:var(--text-3);margin-top:2px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.shop-cat{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.cat-hdr{padding:12px 18px;background:var(--surface-2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.cat-icon{font-size:17px}
.cat-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text)}
.cat-count{font-size:11px;color:var(--text-3);font-family:'DM Mono',monospace;margin-left:auto}
.cat-items{padding:4px 0}
.shop-item{display:flex;align-items:flex-start;gap:10px;padding:8px 18px;cursor:pointer;transition:background var(--ease)}
.shop-item:hover{background:var(--surface-2)}
.shop-item.checked{opacity:.38}
.si-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--accent);transition:var(--ease)}
.shop-item.checked .si-check{background:var(--accent);border-color:var(--accent);color:#fff}
.si-info{flex:1;min-width:0}
.si-name{font-size:14px;color:var(--text)}
.si-qty{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-2);margin-top:1px;font-variant-numeric:tabular-nums}
.si-sub{font-size:11px;color:var(--text-3);margin-top:2px;font-style:italic}

/* PROGRESS BAR */
.day-progress{margin:0 0 20px;padding:13px 16px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border)}
.prog-bar-wrap{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:8px}
.prog-bar{height:100%;background:var(--accent-mid);border-radius:3px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
.prog-sub{font-size:11px;color:var(--text-3);margin-top:5px}

/* MEAL DONE */
.meal-card.done{border-color:var(--accent);background:var(--accent-light)}
.meal-card.done .mc-name{opacity:.7}
.meal-card.disliked{border-color:#E8AAAA}
.meal-card.disliked .mc-name{text-decoration:line-through;opacity:.5}
.mc-done-wrap{padding:8px 14px 10px;display:flex;align-items:center;gap:6px}
.mc-done-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--text-3);transition:var(--ease);cursor:pointer;font-family:inherit}
.mc-done-btn:hover{border-color:var(--accent);color:var(--accent)}
.mc-done-btn.done{background:var(--accent);border-color:var(--accent);color:#fff}
.mc-dislike-btn{flex-shrink:0;padding:4px 8px;border-radius:20px;border:1.5px solid transparent;background:transparent;color:var(--text-3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:var(--ease);font-family:inherit;white-space:nowrap}
.mc-dislike-btn:hover{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.mc-dislike-btn.active{background:#FFEDED;border-color:#E8AAAA;color:#C44}
.mc-alt-badge{padding:5px 14px;background:var(--gold-bg);font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}

/* PANTRY */
.si-pantry-btn{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--text-3);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--ease);line-height:1;font-family:inherit}
.si-pantry-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
.si-pantry-btn.in-pantry{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.shop-item.pantry-item{opacity:.4}
.shop-item.pantry-item .si-name::after{content:' · ya tengo';font-size:10px;color:var(--gold);font-style:italic;font-weight:600}
.si-reuse{font-size:10px;margin-top:4px;display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-weight:500;padding:2px 7px;border-radius:20px;width:fit-content}
.si-reuse.all{background:var(--accent-light);color:var(--accent-mid)}
.si-reuse.multi{background:var(--surface-2);color:var(--text-3)}
.si-reuse.solo{background:#FFF3E0;color:#B46A00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .si-reuse.solo{background:#2A1800;color:#E8962A}}
:root[data-theme="dark"] .si-reuse.solo{background:#2A1800;color:#E8962A}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(8,18,8,.52);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease}
.modal-ov.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;transform:translateY(44px);transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,24px);position:relative}
.modal-ov.open .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0}
.modal-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:none;color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:17px;transition:var(--ease)}
.modal-close:hover{background:var(--border);color:var(--text)}
.m-hdr{padding:20px 24px 0}
.m-mtype{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-3);margin-bottom:6px}
.m-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;line-height:1.15;color:var(--text);text-wrap:balance;margin-bottom:12px}
.m-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.m-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-family:'DM Mono',monospace;background:var(--surface-2);color:var(--text-2)}
.m-chip.accent{background:var(--accent-light);color:var(--accent);font-weight:500}
.m-chip.gold{background:var(--gold-bg);color:var(--gold);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 24px 18px}
.macro{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;text-align:center}
.macro-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.macro-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-top:2px}
.m-sec{padding:0 24px 20px}
.m-sec-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--text-3);margin-bottom:12px}
.ing-list{list-style:none}
.ing-row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.ing-row:last-child{border-bottom:none}
.ing-qty{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-2);min-width:72px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ing-name{color:var(--text)}
.step-list{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px}
.step-n{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--accent);min-width:22px;flex-shrink:0;line-height:1.3}
.step-txt{font-size:14px;line-height:1.6;color:var(--text-2);padding-top:2px}

/* RESPONSIVE */
@media(max-width:740px){.meal-grid{grid-template-columns:1fr 1fr}.meal-card.cena-card{grid-column:span 2}}
@media(max-width:500px){
  .hdr{height:54px}
  .meal-grid{grid-template-columns:1fr 1fr}
  .meal-card.cena-card{grid-column:span 2}
  .shop-grid{grid-template-columns:1fr}
  .macros{grid-template-columns:repeat(4,1fr)}
  .hdr-actions .btn-ghost{display:none}
}
@media(max-width:380px){.meal-grid{grid-template-columns:1fr}.meal-card.cena-card{grid-column:span 1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>

<div class="app">
  <header>
    <div class="hdr">
      <div>
        <div class="logo-eyebrow">Dieta personalizada</div>
        <div class="logo-name">Plan de Dennis</div>
      </div>
      <div class="week-nav">
        <button class="wnav-btn" id="prevWeek" aria-label="Semana anterior">‹</button>
        <span class="wlabel" id="weekLabel">Semana 1</span>
        <button class="wnav-btn" id="nextWeek" aria-label="Semana siguiente">›</button>
      </div>
      <div class="hdr-actions">
        <button class="btn btn-ghost" id="toggleDiet">🥗 Dieta</button>
        <button class="btn btn-ghost" id="toggleShop">🛒 Compra</button>
      </div>
    </div>
  </header>

  <nav class="daynav-wrap" id="dayNav">
    <div class="daynav" id="dayPills"></div>
  </nav>

  <main class="main">
    <div id="dietView">
      <div class="day-hdr">
        <div class="day-hdr-left">
          <h1 class="day-title" id="dayTitle">Lunes</h1>
          <span class="exc-chip" id="excChip"></span>
        </div>
        <span class="kcal-chip" id="kcalChip"></span>
      </div>
      <div id="dayProgress" hidden class="day-progress"></div>
      <div class="meal-grid" id="mealGrid"></div>
    </div>

    <div id="shopView" hidden>
      <div class="shopping-hdr">
        <div class="shop-title" id="shopTitle">Lista de la compra</div>
        <div class="shop-sub" id="shopSub"></div>
      </div>
      <div class="shop-grid" id="shopGrid"></div>
    </div>
  </main>
</div>

<div class="modal-ov" id="modalOv" role="dialog" aria-modal="true" aria-label="Receta">
  <div class="modal" id="modalBox">
    <div class="modal-handle"></div>
    <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const MEAL_TYPES = {
  desayuno: "Desayuno",
  comida: "Comida",
  merienda: "Merienda",
  cena: "Cena"
};

const W1 = {
  id: 1, label: "Semana 1",
  shopping: {
    trip1: {
      label: "Compra del Lunes",
      desc: "Frescos para Lun–Mié · Despensa · Lácteos",
      cats: {
        proteinas: { icon:"🥩", name:"Proteínas (Lun–Mié)", items:[
          { name:"Lubina entera limpia", qty:"2 piezas (~350 g c/u)", sub:"Dorada o besugo · comprarla el mismo lunes, se cocina esa noche" },
          { name:"Lomo de atún fresco", qty:"350 g", sub:"Bonito o pez espada · aguanta 2 días en nevera (martes cena)" },
          { name:"Pechuga de pollo", qty:"300 g", sub:"Muslos deshuesados · para martes comida" },
          { name:"Muslos de pollo (con hueso)", qty:"500 g", sub:"Contramuslos · para miércoles cena (pepitoria)" },
          { name:"Huevos L", qty:"12 unidades", sub:"—" },
        ]},
        verduras: { icon:"🥦", name:"Verduras (Lun–Mié + conservan)", items:[
          { name:"Aguacate", qty:"2 medianos", sub:"Comprar que estén duros, madurarán en 2 días" },

const WEEKS = [W1, W2, W3, W4];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let curWeek = 0;
let curDay = 0;
let showShop = false;
let shopTrip = 'trip1';
let shopChecked = {};
let mealDone = {};
let mealDisliked = {};
let mealSubs = {};   // key: "w-d-type" → {w, d} source week/day for substituted meal
let pantryItems = {};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('plannerState') || '{}');
    mealDone     = s.mealDone     || {};
    mealDisliked = s.mealDisliked || {};
    mealSubs     = s.mealSubs     || {};
    pantryItems  = s.pantryItems  || {};
    shopChecked  = s.shopChecked  || {};
  } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('plannerState', JSON.stringify({mealDone, mealDisliked, mealSubs, pantryItems, shopChecked})); } catch(e) {}
}
loadState();

// RENDER
// ═══════════════════════════════════════════
function getWeek() { return WEEKS[curWeek]; }
function getDay() { return getWeek().days[curDay]; }

function renderDayPills() {
  const week = getWeek();
  const container = document.getElementById('dayPills');
  container.innerHTML = '';
  week.days.forEach((day, i) => {
    const pill = document.createElement('button');
    pill.className = 'day-pill' + (i === curDay ? ' active' : '');
    pill.setAttribute('aria-pressed', i === curDay ? 'true' : 'false');
    const badgeCls = `dp-${day.exercise.type}`;
    pill.innerHTML = `
      <span class="dp-short">${day.short}</span>
      <span class="dp-num">${i + 1}</span>
      <span class="dp-badge ${badgeCls}">${day.exercise.emoji}</span>`;
    pill.addEventListener('click', () => { curDay = i; renderAll(); });
    container.appendChild(pill);
  });
}

const MEAL_ORDER = ['desayuno','comida','merienda','cena'];
const MEAL_LABELS = {desayuno:'Desayuno',comida:'Comida',merienda:'Merienda',cena:'Cena'};

// Find the best alternative meal (same type, different week/day, not disliked, closest kcal)
function findMealAlternative(mealType, excludeWeek, excludeDay) {
  const origKcal = WEEKS[excludeWeek].days[excludeDay].meals[mealType].kcal;
  const candidates = [];
  WEEKS.forEach((week, wi) => {
    week.days.forEach((day, di) => {
      if (wi === excludeWeek && di === excludeDay) return;
      const key = `${wi}-${di}-${mealType}`;
      if (mealDisliked[key]) return;
      candidates.push({ w: wi, d: di, meal: day.meals[mealType] });
    });
  });
  if (!candidates.length) return null;
  candidates.sort((a, b) => Math.abs(a.meal.kcal - origKcal) - Math.abs(b.meal.kcal - origKcal));
  return candidates[0];
}

function renderMealGrid() {
  const day = getDay();
  const grid = document.getElementById('mealGrid');
  grid.innerHTML = '';

  MEAL_ORDER.forEach(type => {
    const doneKey    = `${curWeek}-${curDay}-${type}`;
    const isDone     = !!mealDone[doneKey];
    const isDisliked = !!mealDisliked[doneKey];
    const sub        = mealSubs[doneKey];  // { w, d } or undefined

    // Use substitute meal for display if set, else original
    const m = sub ? WEEKS[sub.w].days[sub.d].meals[type] : day.meals[type];
    // For modal: open the meal that's actually displayed
    const openWeek = sub ? sub.w : curWeek;
    const openDay  = sub ? sub.d : curDay;

    const card = document.createElement('div');
    card.className = 'meal-card'
      + (type === 'cena' ? ' cena-card' : '')
      + (isDone     ? ' done'     : '')
      + (isDisliked ? ' disliked' : '');
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    card.setAttribute('aria-label',`Ver receta: ${m.name}`);

    const altBadge = sub
      ? `<div class="mc-alt-badge">🔄 Alternativa · S${sub.w+1} D${sub.d+1}</div>`
      : '';

    card.innerHTML = `
      ${altBadge}
      <div class="mc-type">${MEAL_LABELS[type]}</div>
      <div class="mc-name">${m.name}</div>
      <div class="mc-footer">
        <span class="mc-kcal">${m.kcal} kcal</span>
        <span class="mc-right">
          ${m.ahead ? '<span class="mc-prep-tag">prep. anterior</span>' : `<span class="mc-prep">${m.time}</span>`}
          <span class="mc-arrow">→</span>
        </span>
      </div>
      <div class="mc-done-wrap">
        <button class="mc-done-btn${isDone ? ' done' : ''}">${isDone ? '✓ Hecho' : '○ Marcar hecho'}</button>
        <button class="mc-dislike-btn${isDisliked ? ' active' : ''}">${sub ? '← Restaurar original' : (isDisliked ? '👎 No me gusta' : '✕ No me gusta')}</button>
      </div>`;

    // Open modal for the displayed meal
    const openCard = () => openModal(type, openWeek, openDay);
    card.addEventListener('click', e => { if (!e.target.closest('.mc-done-wrap')) openCard(); });
    card.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && !e.target.closest('.mc-done-wrap')) { e.preventDefault(); openCard(); } });

    // Done toggle
    card.querySelector('.mc-done-btn').addEventListener('click', e => {
      e.stopPropagation();
      mealDone[doneKey] = !mealDone[doneKey];
      saveState();
      renderDayHeader();
      renderMealGrid();
    });

    // Dislike → auto-substitute / restore original
    card.querySelector('.mc-dislike-btn').addEventListener('click', e => {
      e.stopPropagation();
      if (sub) {
        // Restore original
        delete mealDisliked[doneKey];
        delete mealSubs[doneKey];
      } else {
        mealDisliked[doneKey] = true;
        const alt = findMealAlternative(type, curWeek, curDay);
        if (alt) mealSubs[doneKey] = { w: alt.w, d: alt.d };
      }
      saveState();
      renderMealGrid();
    });

    grid.appendChild(card);
  });
}

function renderDayHeader() {
  const day = getDay();
  document.getElementById('dayTitle').textContent = day.name;
  const chip = document.getElementById('excChip');
  chip.className = `exc-chip exc-${day.exercise.type}`;
  chip.textContent = `${day.exercise.emoji} ${day.exercise.label}`;
  const kcal = document.getElementById('kcalChip');
  kcal.textContent = `~${day.kcal} kcal/día`;

  const doneTypes = MEAL_ORDER.filter(t => mealDone[`${curWeek}-${curDay}-${t}`]);
  const prog = document.getElementById('dayProgress');
  if (doneTypes.length > 0) {
    const kcalEaten    = doneTypes.reduce((s,t) => s + day.meals[t].kcal,    0);
    const proteinEaten = doneTypes.reduce((s,t) => s + day.meals[t].protein, 0);
    const totalProtein = MEAL_ORDER.reduce((s,t) => s + day.meals[t].protein, 0);
    const pct = Math.min(100, Math.round(kcalEaten / day.kcal * 100));
    const remaining = day.kcal - kcalEaten;
    prog.innerHTML = `
      <div class="prog-bar-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      <div class="prog-labels">
        <span>${kcalEaten} kcal comidas (${pct}%)</span>
        <span>${remaining > 0 ? `faltan ${remaining} kcal` : '✓ objetivo alcanzado'}</span>
      </div>
      <div class="prog-sub">Proteína: ${proteinEaten}g de ${totalProtein}g totales del día · ${doneTypes.length}/${MEAL_ORDER.length} comidas</div>`;
    prog.hidden = false;
  } else {
    prog.hidden = true;
  }
}

// For a given pantry item, classify how it should appear in the current week's shopping list
// Returns: 'new' (first time this week), 'replenish' (used every week), 'skip' (already bought earlier)
function pantryItemStatus(itemName, weekIdx) {
  const key = itemName.toLowerCase().trim();
  const map = buildItemWeekMap();
  const weeks = map[key] || [weekIdx + 1];
  const firstWeek = Math.min(...weeks);
  const usedEveryWeek = weeks.length === WEEKS.length;
  if (usedEveryWeek) return 'replenish';
  if (firstWeek === weekIdx + 1) return 'new';
  return 'skip';
}

// Build a map: normalized item name → array of week numbers (1-based) where it appears
function buildItemWeekMap() {
  const map = {};
  WEEKS.forEach((week, wi) => {
    ['trip1', 'trip2'].forEach(tk => {
      if (!week.shopping[tk]) return;
      Object.values(week.shopping[tk].cats).forEach(cat => {
        cat.items.forEach(item => {
          const key = item.name.toLowerCase().trim();
          if (!map[key]) map[key] = [];
          if (!map[key].includes(wi + 1)) map[key].push(wi + 1);
        });
      });
    });
  });
  return map;
}

function renderShopping() {
  const week = getWeek();
  document.getElementById('shopTitle').textContent = 'Lista de la compra';
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';

  // ── Tabs: two trips only ──
  const tabs = document.createElement('div');
  tabs.className = 'trip-tabs';
  const freshRow = document.createElement('div');
  freshRow.className = 'trip-tabs-row';
  ['trip1','trip2'].forEach(tk => {
    const t = week.shopping[tk];
    const btn = document.createElement('button');
    btn.className = 'trip-tab' + (tk === shopTrip ? ' active' : '');
    btn.innerHTML = `
      <div class="trip-tab-label">${tk === 'trip1' ? '🛒 Compra del Lunes' : '🔄 Reposición del Jueves'}</div>
      <div class="trip-tab-name">${t.label}</div>
      <div class="trip-tab-desc">${t.desc}</div>`;
    btn.addEventListener('click', () => { shopTrip = tk; renderShopping(); });
    freshRow.appendChild(btn);
  });
  tabs.appendChild(freshRow);
  grid.appendChild(tabs);

  document.getElementById('shopSub').textContent = `${week.label} · Haz clic para marcar lo que ya tienes`;

  // ── Weekly items ──
  const trip = week.shopping[shopTrip];
  // Pantry categories handled with smart logic (show inline, not skip)
  const PANTRY_CATS = new Set(['cereales','despensa']);

  // Build reuse map once per render
  const itemWeekMap = buildItemWeekMap();

  // Categories for current trip
  Object.entries(trip.cats).forEach(([catKey, cat]) => {
    const isPantryCat = PANTRY_CATS.has(catKey);

    // Filter items for pantry categories using smart status logic
    let visibleItems = [];
    cat.items.forEach((item, j) => {
      if (isPantryCat) {
        const status = pantryItemStatus(item.name, curWeek);
        if (status === 'skip') return; // bought in a previous week — hide
        visibleItems.push({ item, j, pantryStatus: status });
      } else {
        visibleItems.push({ item, j, pantryStatus: null });
      }
    });

    if (visibleItems.length === 0) return; // skip empty categories

    const checked = visibleItems.filter(({j}) => shopChecked[`${curWeek}-${shopTrip}-${catKey}-${j}`]).length;
    const card = document.createElement('div');
    card.className = 'shop-cat';
    const hdr = document.createElement('div');
    hdr.className = 'cat-hdr';
    hdr.innerHTML = `<span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.name}</span><span class="cat-count">${checked}/${visibleItems.length}</span>`;
    card.appendChild(hdr);
    const list = document.createElement('div');
    list.className = 'cat-items';

    visibleItems.forEach(({ item, j, pantryStatus }) => {
      const ck        = shopChecked[`${curWeek}-${shopTrip}-${catKey}-${j}`];
      const isPantry  = !!pantryItems[item.name];
      const usedInWeeks = itemWeekMap[item.name.toLowerCase().trim()] || [curWeek + 1];
      const wCount = usedInWeeks.length;

      let reuseHtml = '';
      if (pantryStatus === 'replenish') {
        // Pantry staple used every week — show as reminder
        reuseHtml = `<span class="si-reuse all">🔄 Básico · reponer si necesario</span>`;
      } else if (pantryStatus === 'new') {
        // First week this pantry item appears
        const future = usedInWeeks.filter(w => w >= curWeek + 1);
        reuseHtml = `<span class="si-reuse multi">🆕 Nuevo · alcanza para S${future.join('+')}</span>`;
      } else {
        // Fresh category — show reuse across weeks
        if (wCount === 4) {
          reuseHtml = `<span class="si-reuse all">✓ Se usa las 4 semanas</span>`;
        } else if (wCount >= 2) {
          reuseHtml = `<span class="si-reuse multi">Se usa en: ${usedInWeeks.map(w=>'S'+w).join(' · ')}</span>`;
        } else {
          reuseHtml = `<span class="si-reuse solo">⚠ Solo en S${usedInWeeks[0]} — compra poco</span>`;
        }
      }

      const row = document.createElement('div');
      row.className = 'shop-item' + (ck ? ' checked' : '') + (isPantry ? ' pantry-item' : '');
      row.innerHTML = `
        <div class="si-check">${ck ? '✓' : ''}</div>
        <div class="si-info">
          <div class="si-name">${item.name}</div>
          ${item.qty ? `<div class="si-qty">${item.qty}</div>` : ''}
          ${reuseHtml}
          ${item.sub && item.sub !== '—' ? `<div class="si-sub">✦ Alt: ${item.sub}</div>` : ''}
        </div>
        <button class="si-pantry-btn${isPantry ? ' in-pantry' : ''}" title="${isPantry ? 'Quitar de despensa fija' : 'Ya lo tengo en casa siempre'}">🏠</button>`;

      // Toggle checked (click on check or info, not pantry btn)
      row.querySelector('.si-check').addEventListener('click', () => {
        const k = `${curWeek}-${shopTrip}-${catKey}-${j}`;
        shopChecked[k] = !shopChecked[k]; saveState(); renderShopping();
      });
      row.querySelector('.si-info').addEventListener('click', () => {
        const k = `${curWeek}-${shopTrip}-${catKey}-${j}`;
        shopChecked[k] = !shopChecked[k]; saveState(); renderShopping();
      });

      // Toggle pantry
      row.querySelector('.si-pantry-btn').addEventListener('click', e => {
        e.stopPropagation();
        pantryItems[item.name] = !pantryItems[item.name]; saveState(); renderShopping();
      });

      list.appendChild(row);
    });
    card.appendChild(list);
    grid.appendChild(card);
  });
}

function renderAll() {
  document.getElementById('weekLabel').textContent = getWeek().label;
  renderDayPills();
  if (!showShop) {
    renderDayHeader();
    renderMealGrid();
  } else {
    renderShopping();
  }
}

function setView(shop) {
  showShop = shop;
  document.getElementById('dietView').hidden = shop;
  document.getElementById('shopView').hidden = !shop;
  document.getElementById('dayNav').style.display = shop ? 'none' : '';
  const btnD = document.getElementById('toggleDiet');
  const btnS = document.getElementById('toggleShop');
  if (shop) {
    btnD.className = 'btn btn-ghost';
    btnS.className = 'btn btn-active';
    renderShopping();
  } else {
    btnD.className = 'btn btn-active';
    btnS.className = 'btn btn-ghost';
    renderDayHeader();
    renderMealGrid();
  }
}

document.getElementById('toggleDiet').addEventListener('click', () => setView(false));
document.getElementById('toggleShop').addEventListener('click', () => setView(true));

function openModal(type, weekIdx, dayIdx) {
  const w = (weekIdx !== undefined) ? weekIdx : curWeek;
  const d = (dayIdx  !== undefined) ? dayIdx  : curDay;
  const m = WEEKS[w].days[d].meals[type];
  const ov = document.getElementById('modalOv');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="m-hdr">
      <div class="m-mtype">${MEAL_LABELS[type]}</div>
      <h2 class="m-title">${m.name}</h2>
      <div class="m-chips">
        <span class="m-chip accent">⏱ ${m.time}</span>
        <span class="m-chip">${m.kcal} kcal</span>
        ${m.ahead ? '<span class="m-chip gold">⭐ Preparar el día anterior</span>' : ''}
      </div>
    </div>
    <div class="macros">
      <div class="macro"><div class="macro-val">${m.kcal}</div><div class="macro-lbl">kcal</div></div>
      <div class="macro"><div class="macro-val">${m.protein}g</div><div class="macro-lbl">Proteína</div></div>
      <div class="macro"><div class="macro-val">${m.carbs}g</div><div class="macro-lbl">HC</div></div>
      <div class="macro"><div class="macro-val">${m.fat}g</div><div class="macro-lbl">Grasas</div></div>
    </div>
    <div class="m-sec">
      <div class="m-sec-ttl">Ingredientes (1 persona)</div>
      <ul class="ing-list">${m.ing.map(it=>`<li class="ing-row"><span class="ing-qty">${it.q}</span><span class="ing-name">${it.i}</span></li>`).join('')}</ul>
    </div>
    <div class="m-sec">
      <div class="m-sec-ttl">Elaboración</div>
      <div class="step-list">${m.steps.map((s,i)=>`<div class="step"><span class="step-n">${i+1}</span><span class="step-txt">${s}</span></div>`).join('')}</div>
    </div>`;
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modalClose').focus();
}

function closeModal() {
  document.getElementById('modalOv').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOv').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
setView(false);
renderAll();
</script>
